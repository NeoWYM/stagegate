summary: >
  Main article table is news.articles with time column published_at (timestamptz).
  No cleanup mechanism exists today. published_at is unindexed; at 30-day retention
  the one-off deletion volume is manageable, but batched deletion is recommended to
  avoid long locks. The news namespace already has a collector CronJob whose
  conventions can be followed.

