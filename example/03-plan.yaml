  - { item: "dependencies acyclic", done: true }
  - { item: "destructive operations have a human gate", done: true }
  - { item: "low reversibility → rollback_plan complete with checkpoint task (t5)", done: true }
  - { item: "full + low reversibility → whole plan signed off by user", done: true }
